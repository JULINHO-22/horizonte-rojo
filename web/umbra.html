<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101318">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101318; color: #fff1db; font: 16px system-ui, sans-serif; }
    main { width: min(100% - 32px, 1280px); margin: 20px auto; }
    header, footer { display: flex; align-items: baseline; gap: 12px 28px; justify-content: space-between; flex-wrap: wrap; }
    header { margin-bottom: 13px; border-bottom: 1px solid #394652; padding-bottom: 12px; }
    h1, p { margin: 0; }
    h1 { font-size: clamp(21px, 4vw, 32px); letter-spacing: .15em; }
    .tag, footer { color: #b3bfc8; font-size: 13px; letter-spacing: .05em; }
    .tag { color: #7df0e0; }
    section { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid #394652; background: #181c24; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #launch { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 16px; padding: 16px; text-align: center; background: radial-gradient(ellipse at 65% 80%, #623825, #191e27 72%); }
    #launch[hidden] { display: none; }
    button { padding: 10px 18px; border: 1px solid #7df0e0; background: #151b22; color: #7df0e0; font: inherit; cursor: pointer; }
    button:focus-visible, button:hover { background: #7df0e0; color: #101318; }
    button:disabled { opacity: .6; cursor: wait; }
    footer { margin-top: 12px; align-items: center; }
    section:fullscreen { border: 0; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
<main>
  <header><h1>UMBRA</h1><p class="tag">MARTE / CINCO SOLES PARA SOBREVIVIR</p></header>
  <section id="stage" aria-label="Juego UMBRA">
    <canvas id="canvas" tabindex="0">Tu navegador necesita WebGL 2 para jugar.</canvas>
    <div id="launch">
      <p class="tag">PUESTO UMBRA / TRANSMISIÓN 01</p>
      <h2>Una tormenta. Cinco soles.</h2>
      <button id="play" type="button">Cargar UMBRA</button>
      <p id="status" role="status">Juego para teclado y ratón</p>
    </div>
  </section>
  <footer>
    <p>WASD / FLECHAS PARA MOVERTE · E PARA INTERACTUAR</p>
    <button id="fullscreen" type="button" hidden>Pantalla completa</button>
  </footer>
</main>
<script src="$GODOT_URL"></script>
<script>
  const canvas = document.querySelector("#canvas");
  const stage = document.querySelector("#stage");
  const play = document.querySelector("#play");
  const status = document.querySelector("#status");
  const fullscreen = document.querySelector("#fullscreen");
  function fitCanvas() {
    const bounds = stage.getBoundingClientRect();
    const density = Math.min(devicePixelRatio, 2);
    canvas.width = Math.round(bounds.width * density);
    canvas.height = Math.round(bounds.height * density);
  }
  new ResizeObserver(fitCanvas).observe(stage);
  play.addEventListener("click", async () => {
    play.disabled = true;
    status.textContent = "Cargando la misión…";
    try {
      if (!Engine.isWebGLAvailable()) throw new Error("Se requiere WebGL 2.");
      fitCanvas();
      await new Engine($GODOT_CONFIG).startGame({
        canvas,
        onProgress(current, total) {
          if (total > 0) status.textContent = `Cargando ${Math.floor(current / total * 100)} %`;
        }
      });
      document.querySelector("#launch").hidden = true;
      fullscreen.hidden = !stage.requestFullscreen;
      canvas.focus();
    } catch (error) {
      status.textContent = `No se pudo iniciar UMBRA. ${error.message || error}`;
      play.disabled = false;
    }
  });
  fullscreen.addEventListener("click", async () => {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await stage.requestFullscreen();
    canvas.focus();
  });
</script>
</body>
</html>
