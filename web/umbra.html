<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19131e">
  <link rel="preload" href="portada-umbra.webp" as="image">
  <link rel="preload" href="barlow-condensed-bold-latin.woff2" as="font" type="font/woff2" crossorigin>
  <title>Red Horizon · Cinco días en Marte</title>
  <style>
    @font-face { font-family: Barlow; src: url("barlow-latin.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Barlow Condensed"; src: url("barlow-condensed-bold-latin.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      font: 16px Barlow, "Segoe UI", sans-serif;
      color: #fff2e2;
      background: #19131e;
      --separacion: clamp(1.35rem, 6vw, 7.5rem);
      --acento: #ffc198;
    }
    body { margin: 0; }
    [hidden] { display: none !important; }
    #stage { position: relative; min-height: 100dvh; display: grid; place-items: center; background: #100d14; }
    canvas { grid-area: 1 / 1; display: block; width: min(100vw, 177.778dvh); height: min(100dvh, 56.25vw); outline: 0; }
    #launch {
      grid-area: 1 / 1; align-self: stretch; justify-self: stretch;
      position: relative; isolation: isolate; overflow: hidden;
      display: grid; grid-template-rows: 1fr auto;
      min-height: 100dvh; padding: clamp(1.6rem, 4vh, 3.75rem) var(--separacion);
      background: #19131e;
    }
    .paisaje, #launch::before {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    .paisaje { z-index: -2; object-fit: cover; object-position: 68% 50%; }
    #launch::before {
      z-index: -1; content: "";
      background: linear-gradient(90deg, #140f1be6, #1812219c 32%, #19132109 64%),
        linear-gradient(0deg, #130e19d6, transparent 26%);
    }
    .idiomas {
      position: absolute; top: clamp(.85rem, 3vw, 1.8rem); right: clamp(.85rem, 3vw, 2rem);
      display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: .38rem;
      max-width: min(36rem, 92vw); z-index: 2;
    }
    .idiomas span { color: #f0dcd1; font-size: .82rem; margin-inline-end: .2rem; }
    .idiomas button {
      padding: .35rem .65rem; border: 1px solid #8a756c; border-radius: .28rem;
      background: #201923d9; color: #fff2e2; font-size: .83rem;
    }
    .idiomas button:hover { background: #33262fe6; border-color: var(--acento); }
    .idiomas button[aria-pressed="true"] {
      background: var(--acento); color: #2b1921; border-color: var(--acento); font-weight: 700;
    }
    .idiomas button:disabled { opacity: .65; cursor: wait; }
    .expedicion { align-self: center; justify-self: start; padding-block: 1rem 2rem; }
    h1 {
      margin: 0 0 .24em;
      font: 700 clamp(4.4rem, 8.3vw, 9.25rem)/.9 "Barlow Condensed", "Arial Narrow", sans-serif;
      letter-spacing: -.025em;
    }
    h1 span { color: var(--acento); }
    p { margin: 0; }
    .bienvenida {
      margin-bottom: .7rem;
      color: var(--acento); font-size: clamp(.83rem, 1.1vw, 1rem);
      font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    }
    .historia {
      max-width: 32ch; color: #f0dcd1;
      font-size: clamp(1.12rem, 1.7vw, 1.42rem); line-height: 1.36;
    }
    button, summary { font: inherit; cursor: pointer; }
    button:focus-visible, summary:focus-visible { outline: 2px solid #fff2e2; outline-offset: 5px; }
    #play {
      display: inline-flex; justify-content: space-between; align-items: center; gap: 1.65rem;
      min-width: 13.45rem; min-height: 54px; margin-top: clamp(1.25rem, 3.7vh, 2.1rem);
      padding: .72rem 1rem .78rem 1.2rem;
      background: var(--acento); color: #2b1921; border: 0; border-radius: .28rem;
      font-size: 1.1rem; font-weight: 700;
    }
    #play:hover { background: #ffd9bb; }
    #play:disabled { cursor: wait; opacity: .8; }
    #play span[aria-hidden] { font-size: 1.35em; line-height: 1; }
    .estado { max-width: 22rem; min-height: 3rem; margin-top: .8rem; }
    #status { min-height: 1.3em; color: #e3cdbf; font-size: .94rem; line-height: 1.3; }
    .carga { display: flex; align-items: center; gap: .65rem; margin: .45rem 0 0; }
    #progreso { flex: 1; min-width: 0; height: .3rem; accent-color: var(--acento); }
    #porcentaje { min-width: 4ch; color: var(--acento); font-size: .83rem; text-align: right; font-variant-numeric: tabular-nums; }
    .extras { justify-self: start; max-width: 100%; }
    .extras summary { color: #f0dcd1; width: fit-content; padding: .35rem .1rem; }
    .extras summary:hover, .finales button:hover { color: var(--acento); }
    .finales { display: flex; flex-wrap: wrap; gap: .1rem 1.2rem; margin-top: .3rem; }
    .finales button {
      min-height: 42px; padding: .35rem .05rem; border: 0;
      background: transparent; color: #fff2e2; text-decoration: underline; text-underline-offset: .22em;
    }
    #fullscreen { position: absolute; right: .75rem; bottom: .6rem; background: #201923e8; color: #fff2e2; border: 1px solid #8a756c; border-radius: .28rem; min-width: 44px; min-height: 40px; }
    @media (max-width: 680px) and (orientation: portrait) {
      #launch { padding-top: 41svh; }
      .paisaje { height: 66svh; object-position: 76% 55%; }
      #launch::before { background: linear-gradient(0deg, #19131e 39%, transparent 69%); }
      .idiomas { max-width: calc(100vw - 1.7rem); }
      .expedicion { padding-block: .3rem 1.25rem; }
      h1 { font-size: clamp(3.55rem, 12.7vw, 5.2rem); }
    }
    @media (max-height: 540px) and (orientation: landscape) {
      .expedicion { padding-block: .4rem 1rem; }
      h1 { font-size: clamp(3.5rem, 8.3vw, 5.9rem); }
    }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
<main id="stage" aria-label="Juego Red Horizon">
  <canvas id="canvas" tabindex="0" inert>Abre el juego en un navegador con gráficos 3D habilitados.</canvas>
  <section id="launch" aria-labelledby="titulo-juego">
    <img class="paisaje" src="portada-umbra.webp" alt="" fetchpriority="high">
    <div class="idiomas" role="group" aria-label="Idioma" dir="ltr">
      <span id="idioma-label">Idioma</span>
      <button type="button" data-lang="es" aria-pressed="true">Español</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
      <button type="button" data-lang="fr" aria-pressed="false">Français</button>
      <button type="button" data-lang="ru" aria-pressed="false">Русский</button>
      <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
      <button type="button" data-lang="zh" aria-pressed="false">简体中文</button>
    </div>
    <div class="expedicion">
      <p class="bienvenida">Cinco días en Marte</p>
      <h1 id="titulo-juego" dir="ltr"><span>Red</span> Horizon</h1>
      <p class="historia">Acompaña a Nora, Iris y Teo. Cuida el refugio Umbra y prepara el regreso a la Tierra.</p>
      <button id="play" type="button"><span id="play-texto">Entrar al recorrido</span><span aria-hidden="true">↗</span></button>
      <div class="estado">
        <p id="status" role="status">Preparando la descarga…</p>
        <div class="carga" hidden>
          <progress id="progreso" max="1" aria-label="Descarga del juego"></progress>
          <span id="porcentaje" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <details class="extras">
      <summary>Escenas extra</summary>
      <div class="finales">
        <button type="button" data-final="recursos">Probar mecánicas</button>
        <button type="button" data-final="incompleta">Misión incompleta</button>
        <button type="button" data-final="cumplida">Misión cumplida</button>
      </div>
    </details>
  </section>
  <button id="fullscreen" type="button" aria-label="Pantalla completa" title="Pantalla completa" hidden>⛶</button>
</main>
<script src="$GODOT_URL"></script>

    }

  const STORAGE_KEY = "horizonte_rojo_lang";
  const canvas = document.querySelector("#canvas");
  const stage = document.querySelector("#stage");
  const launch = document.querySelector("#launch");
  const play = document.querySelector("#play");
  const playTexto = document.querySelector("#play-texto");
  const status = document.querySelector("#status");
  const progreso = document.querySelector("#progreso");
  const carga = document.querySelector(".carga");
  const porcentaje = document.querySelector("#porcentaje");
  const fullscreen = document.querySelector("#fullscreen");
  const idiomaBar = document.querySelector(".idiomas");
  const idiomaBtns = [...document.querySelectorAll("[data-lang]")];
  const finales = [...document.querySelectorAll("[data-final]")];
  let lang = (() => {
    const param = new URLSearchParams(location.search).get("lang");
    if (param && TEXTOS[param]) return param;
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && TEXTOS[saved]) return saved;
    } catch {}
    return "es";
  })();
  let estadoClave = "preparando";
  let playClave = "jugar";
  function aplicarIdioma(codigo, guardar = true) {
    if (!TEXTOS[codigo]) codigo = "es";
    lang = codigo;
    if (guardar) {
      try { localStorage.setItem(STORAGE_KEY, lang); } catch {}
    }
    const tx = TEXTOS[lang];
    document.documentElement.lang = tx.htmlLang;
    document.title = tx.docTitle;
    stage.setAttribute("aria-label", tx.stageAria);
    canvas.textContent = tx.canvas;
    launch.dir = tx.dir;
    idiomaBar.setAttribute("aria-label", tx.idioma);
    document.querySelector("#idioma-label").textContent = tx.idioma;
    document.querySelector(".bienvenida").textContent = tx.subtitulo;
    document.querySelector(".historia").textContent = tx.historia;
    playTexto.textContent = tx[playClave] || tx.jugar;
    document.querySelector(".extras summary").textContent = tx.extras;
    document.querySelector('[data-final="recursos"]').textContent = tx.fRecursos;
    document.querySelector('[data-final="incompleta"]').textContent = tx.fIncompleta;
    document.querySelector('[data-final="cumplida"]').textContent = tx.fCumplida;
    progreso.setAttribute("aria-label", tx.descargaAria);
    status.textContent = tx[estadoClave] || tx.listo;
    fullscreen.setAttribute("aria-label", tx.fullscreen);
    fullscreen.title = tx.fullscreen;
    idiomaBtns.forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang)));
  }
  idiomaBtns.forEach(btn => btn.addEventListener("click", () => aplicarIdioma(btn.dataset.lang)));
  aplicarIdioma(lang, false);
  function fitCanvas() {
    const bounds = canvas.getBoundingClientRect();
    if (!bounds.width || !bounds.height) return;
    const density = Math.min(devicePixelRatio, 1280 / bounds.width, 720 / bounds.height);
    const width = Math.round(bounds.width * density);
    const height = Math.round(bounds.height * density);
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
  }
  new ResizeObserver(fitCanvas).observe(canvas);
  const config = $GODOT_CONFIG;
  const pack = config.mainPack || config.executable + ".pck";
  let engine;
  let motor;
  let datos;
  let preparacion;
  let listo = false;
  let necesitaRecarga = false;
  function mostrarProgreso(valor) {
    progreso.value = valor;
    const texto = Math.floor(valor * 100) + "%";
    if (porcentaje.textContent !== texto) porcentaje.textContent = texto;
  }
  function preparar() {
    if (preparacion) return preparacion;
    if (typeof Engine === "undefined") return Promise.reject(new Error("loader"));
    if (!Engine.isWebGLAvailable(2)) return Promise.reject(new Error("webgl2"));
    carga.hidden = false;
    mostrarProgreso(0);
    estadoClave = "descargando";
    status.textContent = TEXTOS[lang].descargando;
    engine ??= new Engine({
      ...config,
      onProgress(current, total) {
        if (total > 0 && !listo) mostrarProgreso(Math.min(0.99, current / total));
      }
    });
    // Godot inicializa una sola instancia por página. Reintenta solo el archivo que falló.
    motor ??= Engine.load(config.executable, config.fileSizes[config.executable + ".wasm"])
      .catch(error => {
        Engine.unload();
        motor = undefined;
        throw error;
      }).then(() => engine.init(config.executable));
    datos ??= engine.preloadFile(pack, pack).catch(error => {
      datos = undefined;
      throw error;
    });
    preparacion = Promise.all([motor, datos]).then(() => {
      listo = true;
      mostrarProgreso(1);
      carga.hidden = true;
      estadoClave = play.disabled ? "abriendoEst" : "listo";
      status.textContent = TEXTOS[lang][estadoClave];
    }).catch(error => {
      preparacion = undefined;
      throw error;
    });
    return preparacion;
  }
  // Adelantar la descarga mientras se ve la portada. La partida arranca al elegir.
  preparar().catch(error => {
    if (!play.disabled) {
      carga.hidden = true;
      necesitaRecarga = error.message === "loader";
      estadoClave = error.message === "webgl2" ? "errActivaWebgl" : "errReintentarDescarga";
      status.textContent = TEXTOS[lang][estadoClave];
    }
  });
  async function iniciar(final = "") {
    if (play.disabled) return;
    if (necesitaRecarga) {
      location.reload();
      return;
    }

    finales.forEach(button => { button.disabled = true; });
    play.disabled = true;
    playClave = listo ? "abriendo" : "cargando";
    estadoClave = listo ? "abriendoEst" : "descargando";
    playTexto.textContent = TEXTOS[lang][playClave];
    status.textContent = TEXTOS[lang][estadoClave];
    let inicioInvocado = false;
    try {
      fitCanvas();
      await preparar();
      estadoClave = "abriendoEst";
      status.textContent = TEXTOS[lang][estadoClave];
      const args = ["--main-pack", pack, "--", "--lang=" + lang];
      if (final) args.push("--final-" + final);
      canvas.inert = false;
      inicioInvocado = true;
      await engine.start({ canvas, args });
      launch.hidden = true;
      fullscreen.hidden = !stage.requestFullscreen;
      canvas.focus();
    } catch (error) {
      console.error(error);
      listo = false;
      preparacion = undefined;
      necesitaRecarga = inicioInvocado || error.message === "loader";
      canvas.inert = true;
      estadoClave = error.message === "webgl2" ? "errActivaWebgl" : necesitaRecarga ? "errRecarga" : "errDescarga";
      status.textContent = TEXTOS[lang][estadoClave];
      carga.hidden = true;
      playClave = necesitaRecarga ? "recargar" : "reintentar";
      playTexto.textContent = TEXTOS[lang][playClave];
      play.disabled = false;
      finales.forEach(button => { button.disabled = false; });
      idiomaBtns.forEach(button => { button.disabled = false; });
    }
  }
  play.addEventListener("click", () => iniciar());
  finales.forEach(button => button.addEventListener("click", () => iniciar(button.dataset.final)));
  fullscreen.addEventListener("click", async () => {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await stage.requestFullscreen();
    canvas.focus();
  });
</script>
</body>
</html>
